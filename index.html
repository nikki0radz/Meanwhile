-height:160px;resize:vertical;line-height:1.7}label.field{display:block;margin:18px 0}label.field>span{display:block;font-size:13px;margin-bottom:7px}.tabs{display:flex;background:var(--bg);padding:4px;border-radius:13px;margin:20px 0}.tabs button{flex:1;padding:9px;border-radius:10px}.tabs button.active{background:var(--paper);box-shadow:0 1px 5px #0001}.dialog-back{position:fixed;inset:0;background:#27203370;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}.dialog{background:var(--paper);border-radius:25px;padding:30px;width:580px;max-height:92dvh;overflow:auto;box-shadow:0 20px 90px #24163230}.close{font-size:25px;line-height:1}.recorder{text-align:center;background:var(--bg);border-radius:16px;padding:24px;margin-bottom:18px}.record{border-radius:50%;background:var(--purple);color:white;width:78px;height:78px;font-size:28px;box-shadow:0 0 0 9px var(--lav);margin:14px}.record.live{background:#a95765;animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 15px #b96f7c25}}.wave{font-size:24px;letter-spacing:5px;color:var(--purple);height:40px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:23px;flex-wrap:wrap}.summary{background:var(--lav);padding:18px;border-radius:15px;margin:18px 0}.summary ul{padding-left:20px;margin-bottom:0}.summary li{margin:8px 0}.notify{position:fixed;bottom:25px;right:25px;background:var(--ink);color:white;max-width:360px;padding:18px 23px;border-radius:17px;z-index:30;box-shadow:0 8px 40px #0003}.notify p{font-size:13px;margin-top:4px}.history-item{padding:20px 0;border-bottom:1px solid var(--line)}.history-item p{margin-top:8px;color:var(--muted)}.badge{font-size:10px;background:var(--peach);padding:4px 8px;border-radius:9px}.brief{background:var(--lav);border-color:transparent}.brief ol{padding-left:20px}.brief li{margin:15px 0}.empty{text-align:center;color:var(--muted);padding:30px}.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toggle{ac </style></head><body><div class="shell"><header><div class="brand"><span class="mark">❋</span>Meanwhile</div><nav id="nav"><button data-view="home" class="active">My week</button><button data-view="prep">Next session</button><button data-view="history">Session notes</button><button data-view="settings">Reminders</button></nav><span class="avatar">N</span></header><main id="main"></main><div class="footer">A little space to carry things forward. <span class="dot"></span> Saved on this device · Interactive demo</div></div><div id="modal"></div><div id="toast" class="hidden" role="status"></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('meanwhile-v1'))}catch{}state=state||{appointment:'2026-10-30T10:00',duration:60,weekly:true,tasks:[{title:'Explore what support would actually help me',note:'Think of one small thing I would choose for myself.',done:false},{title:'Notice a moment when I want reassurance',note:'What did I need in that moment?',done:false}],notes:[{date:'2026-10-23T11:00',title:'Making space for my own choices',text:'We talked about wanting more structure between sessions. I want to choose something useful for myself and discuss it together next time.',kind:'Session debrief'}],thoughts:[],reminders:{debrief:true,practice:true,brief:true,private:true,lead:'30',practiceTime:'18:00'},prep:'I would like to discuss what kind of between-session practice would help me, and how structure can support me without turning it into a test.',customSections:[]};let view='home',mode='text',recording=false,paused=false,recTimer=null,seconds=0,currentKind='thought',draft='',saved=true;function save(){try{localStorage.setItem('meanwhile-v1',JSON.stringify(state));saved=true}catch{saved=false;toast('Could not save','Device storage is unavailable. Keep a copy before closing.')} }function toast(title,body=''){const t=$('#toast');t.className='notify';t.innerHTML='<strong>'+esc(title)+'</strong><p>'+esc(body)+'</p>';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.className='hidden',5000)}function ap(){let d=new Date(state.appointment);return{d,day:d.toLocaleDateString('en-GB',{day:'numeric'}),month:d.toLocaleDateString('en-GB',{month:'short'}),full:d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}),time:d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}}function tasks(){return state.tasks.map((t,i)=>`<div class="task ${t.done?'done':''}"><input aria-label="Complete ${esc(t.title)}" type="checkbox" ${t.done?'checked':''} onchange="state.tasks[${i}].done=this.checked;save();render()"><div style="flex:1"><strong>${esc(t.title)}</strong><p>${esc(t.note)}</p></div><button aria-label="Edit practice" onclick="editTask(${i})">✎</button></div>`).join('')}function head(ey,title,sub,extra=''){return `<div class="top"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${extra}</div>`}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const a=ap();let html='';if(view==='home')html=head('Your space, at your pace','The work between the words.','A place for what stays with you, and what comes next.','<span class="pill">✧ No streaks. No scores.</span>')+`<div class="grid"><section><div class="card hero"><div class="orbit"></div><div class="eyebrow">After your session</div><h2>Put it down while<br>it’s still with you.</h2><p>What came up? What felt useful? Leave yourself a few words to return to.</p><button class="primary" onclick="openCapture('debrief')">＋ Debrief a session</button></div><div class="card"><div class="row section-title"><h2>Something to try</h2><button class="link" onclick="editTask()">＋ Add</button></div><p class="small">Small things you choose. Space to change your mind.</p>${tasks()}<button class="link" style="margin-top:16px" onclick="openCapture('practice')">Continue a reflection →</button></div><div class="card"><div class="eyebrow">Catch it before it goes</div><h2>A thought for later?</h2><p class="sub">You don’t need to make sense of it just yet.</p><div class="quick"><button onclick="openCapture('thought','text')">✎ &nbsp; Write a thought</button><button onclick="openCapture('thought','voice')">◉ &nbsp; Leave a voice note</button></div></div></section><aside><div class="card"><div class="row"><div class="eyebrow" style="margin:0">Your next session</div><button class="link" onclick="editAppointment()">Edit</button></div><div class="appointment"><div class="datebox"><span class="small">${a.month.toUpperCase()}</span><strong>${a.day}</strong></div><div><h3>${esc(a.full.split(',')[0])}</h3><p>${a.time} · ${state.duration} minutes</p><span class="small">${state.weekly?'Every week':'One appointment'} · Local time</span></div></div><button class="secondary" style="width:100%" onclick="go('prep')">Open my session brief ↗</button></div><div class="card note"><div class="eyebrow">A thread to follow</div><p>“What would I choose to work on if nobody was checking?”</p><button class="link" onclick="openCapture('practice')">Sit with this thought →</button></div><div class="card"><div class="eyebrow">A gentle nudge</div><h3>Make room for remembering.</h3><p class="small" style="margin:10px 0 17px">After your session, during the week, and just before you go back.</p><button class="link" onclick="go('settings')">Set up my reminders →</button></div></aside></div>`;
if(view==='prep')html=head('Bring what matters','A little less “where do I start?”','Your notes, gathered for the next conversation.','<button class="secondary" onclick="editAppointment()">Edit appointment</button>')+`<div class="grid"><section><div class="card brief"><div class="row"><div class="eyebrow" style="margin:0">At a glance · ${esc(a.full)}</div><span class="badge">Demo summary</span></div><h2 style="margin-top:17px">What I want to bring</h2><ol>${briefPoints().map(x=>`<li>${esc(x)}</li>`).join('')}</ol><button class="secondary" onclick="refreshBrief()">✧ Refresh demo summary</button><p class="small" style="margin-top:12px">Suggested wording to review, rather than advice or an interpretation.</p></div><div class="card"><h2>My preparation</h2><p class="small" style="margin:8px 0 15px">What would help you get what you need from this session?</p><textarea aria-label="My preparation" oninput="state.prep=this.value;save()">${esc(state.prep)}</textarea><div class="actions"><button class="secondary" onclick="openCapture('prep','voice')">◉ Add by voice</button><button class="primary" onclick="save();toast(saved?'Preparation saved':'Save unavailable')">Save preparation</button></div></div><div class="card"><div class="row"><h2>My own sections</h2><button class="link" onclick="addSection()">＋ Add section</button></div>${state.customSections.map((s,i)=>`<label class="field"><span>${esc(s.title)} <button class="link" onclick="state.customSections.splice(${i},1);save();render()">Remove</button></span><textarea oninput="state.customSections[${i}].text=this.value;save()">${esc(s.text)}</textarea></label>`).join('')}<p class="small" style="margin-top:12px">Add space for questions, patterns, or anything you want to bring.</p></div></section><aside><div class="card"><h2>My chosen practice</h2>${tasks()}<button class="link" onclick="editTask()">＋ Choose something to try</button></div><div class="card"><h2>Caught during the week</h2>${state.thoughts.length?state.thoughts.map(t=>`<div class="history-item"><p>${esc(t.text)}</p><span class="small">${new Date(t.date).toLocaleDateString('en-GB')}</span></div>`).join(''):'<p class="sub">A thought doesn’t have to be polished to be worth bringing.</p>'}<button class="link" style="margin-top:15px" onclick="openCapture('thought')">＋ Add a thought</button></div></aside></div>`;
if(view==='history')html=head('A place to come back to','Session notes','Keep the original words alongside your takeaways.','<button class="primary" onclick="openCapture(\'debrief\')">＋ New debrief</button>')+`<div class="card"><input type="text" aria-label="Search session notes" placeholder="Search your sessions…" oninput="filterNotes(this.value)"><div id="note-list">${noteList('')}</div></div>`;
if(view==='settings')html=head('A nudge, on your terms','Make space to remember.','Choose when you want a reminder, and what it reveals.')+`<div class="grid"><section><div class="card"><div class="row"><h2>Your appointment</h2><button class="link" onclick="editAppointment()">Edit</button></div><p class="sub">${esc(a.full)} · ${a.time} · ${state.duration} minutes</p><p class="small">${state.weekly?'Repeats weekly':'Does not repeat'}</p></div><div class="card"><h2>Your reminder rhythm</h2>${reminderRow('debrief','After the session','A little time to debrief, when the session ends.')}${reminderRow('practice','During the week','A gentle invitation to continue your chosen practice.')}<label class="field"><span>Practice reminder time · Tuesday and Thursday</span><input type="time" value="${state.reminders.practiceTime}" onchange="state.reminders.practiceTime=this.value;save()"></label>${reminderRow('brief','Before the next session','Open your talking points before you go in.')}<label class="field"><span>Remind me before therapy</span><select onchange="state.reminders.lead=this.value;save()">${['10','30','60'].map(n=>`<option value="${n}" ${state.reminders.lead===n?'selected':''}>${n} minutes before</option>`).join('')}</select></label></div></section><aside><div class="card note"><h2>Try a reminder</h2><p class="sub">Preview how a nudge will feel. This demo does not schedule phone notifications.</p><label class="field"><span>Reminder preview</span><select id="preview-kind"><option value="brief">Before therapy</option><option value="debrief">After therapy</option><option value="practice">During the week</option></select></label><button class="primary" onclick="previewReminder()">Preview notification</button></div><div class="card">${reminderRow('private','Discreet notification text','Keep therapy details off your lock screen.')}<p class="small" style="margin-top:15px">Real device permissions and offline scheduled reminders will be connected in the Android version. No permission is requested by this demo.</p></div><div class="card"><h3>Your data</h3><p class="small" style="margin:10px 0">Stored in this browser on this device. Clearing browser data removes it; this prototype is not encrypted.</p><button class="link" onclick="exportData()">Export my notes</button></div></aside></div>`;$('#main').innerHTML=html}function reminderRow(k,t,d){return `<div class="task"><div style="flex:1"><strong>${t}</strong><p>${d}</p></div><input class="toggle" type="checkbox" aria-label="${t}" ${state.reminders[k]?'checked':''} onchange="state.reminders.${k}=this.checked;save()"></div>`}function go(v){view=v;render();window.scrollTo(0,0)}$('#nav').onclick=e=>{if(e.target.dataset.view)go(e.target.dataset.view)};function briefPoints(){return[state.prep.trim()||'Add what you would like to discuss.',...state.tasks.map(t=>(t.done?'Tried: ':'Explore: ')+t.title),...state.thoughts.slice(-2).map(t=>'A thought to bring: '+t.text)].slice(0,5)}function refreshBrief(){toast('Gathering your notes…','Demo summary');setTimeout(()=>{render();toast('Brief refreshed','Your preparation, practice and latest thoughts are gathered above.')},900)}function noteList(q){let ns=state.notes.filter(n=>(n.title+' '+n.text).toLowerCase().includes(q.toLowerCase()));return ns.length?ns.map(n=>`<article class="history-item"><div class="row"><span class="eyebrow" style="margin:0">${new Date(n.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</span><span class="badge">${esc(n.kind)}</span></div><h2 style="margin-top:12px">${esc(n.title)}</h2><p style="white-space:pre-wrap">${esc(n.text)}</p>${n.takeaway?`<div class="summary"><strong>My takeaways</strong><p>${esc(n.takeaway)}</p></div>`:''}</article>`).join(''):'<p class="empty">No matching session notes.</p>'}function filterNotes(q){$('#note-list').innerHTML=noteList(q)}function showModal(content){$('#modal').innerHTML=`<div class="dialog-back"><section class="dialog" role="dialog" aria-modal="true" aria-label="${currentKind==='debrief'?'Session debrief':'Edit your notes'}"><div class="row"><span class="eyebrow" style="margin:0">Meanwhile</span><button class="close" aria-label="Close dialog" onclick="closeModal()">×</button></div>${content}</section></div>`;$('#modal .close').focus()}function closeModal(){if(recTimer)clearInterval(recTimer);recording=false;$('#modal').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#modal .dialog')){const els=[...$('#modal .dialog').querySelectorAll('button,input,select,textarea,a')].filter(x=>!x.disabled&&!x.closest('.hidden'));const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});function openCapture(kind,m='text'){currentKind=kind;mode=m;draft='';seconds=0;recording=false;paused=false;captureUI()}const demoTexts={debrief:'Today we talked about wanting more structure between sessions. I want to think about what I would choose to work on for myself, rather than waiting to be told. Next time I want to discuss a small, practical exercise we can agree on together.',practice:'I noticed I wanted someone to tell me I had done the right thing. Before asking, I paused and wrote down my own view. I still felt unsure, but it helped me see what I actually thought.',thought:'I want to ask whether having reminders and a bit of structure could help me follow through, even while I am working on needing less reassurance.',prep:'I want to discuss what kind of practice would be useful between sessions. What would make an exercise feel like something I chose, rather than something I need to get right?'};function captureUI(){const titles={debrief:'What stayed with you?',practice:'Pick up the thread.',thought:'Catch a thought.',prep:'What do you want to bring?'};showModal(`<h2 style="margin-top:20px">${titles[currentKind]}</h2><p class="small" style="margin-top:8px">${currentKind==='debrief'?'A few words about the session. You can organise them afterwards.':'Write or speak. It can be unfinished.'}</p><div class="tabs"><button class="${mode==='text'?'active':''}" onclick="switchMode('text')">✎ Write</button><button class="${mode==='voice'?'active':''}" onclick="switchMode('voice')">◉ Voice note</button></div>${mode==='voice'?`<div class="recorder"><span class="pill">Simulated recording · No microphone used</span><div class="wave" id="wave">│ ı │ ı │ ı │ ı │</div><button id="record-btn" class="record" onclick="startRecord()" aria-label="Record demo voice note">●</button><p id="rec-status">Tap to try recording</p><div class="actions" style="justify-content:center"><button id="pause-btn" class="secondary hidden" onclick="pauseRecord()">Pause</button><button id="stop-btn" class="secondary hidden" onclick="stopRecord()">Stop & transcribe</button></div></div>`:''}<label class="field"><span>${mode==='voice'?'Editable transcript':'Your words'}</span><textarea id="capture-text" placeholder="Start wherever you are…" oninput="draft=this.value">${esc(draft)}</textarea></label>${mode==='voice'?'<button class="link" onclick="playDemo()">▷ Preview silent demo playback</button>':'<button class="link" onclick="draft=demoTexts[currentKind];captureUI()">Try with sample text</button>'}<div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="reviewCapture()">${currentKind==='debrief'?'Continue to takeaways →':'Save thought'}</button></div><p class="small" style="margin-top:12px">Demo AI is simulated. Your text is not sent to an AI service.</p>`)}function switchMode(m){if(recording){toast('Finish recording first');return}draft=$('#capture-text').value;mode=m;captureUI()}function startRecord(){if(recording)return;recording=true;paused=false;seconds=0;$('#record-btn').classList.add('live');$('#record-btn').disabled=true;$('#rec-status').textContent='Recording demo · 0:00';$('#pause-btn').classList.remove('hidden');$('#stop-btn').classList.remove('hidden');recTimer=setInterval(()=>{if(!paused){seconds++;$('#rec-status').textContent='Recording demo · 0:'+String(seconds).padStart(2,'0');if(seconds>=3)stopRecord()}},1000)}function pauseRecord(){paused=!paused;$('#pause-btn').textContent=paused?'Resume':'Pause';$('#rec-status').textContent=paused?'Paused · Your place is kept':'Recording demo…';$('#record-btn').classList.toggle('live',!paused)}function stopRecord(){clearInterval(recTimer);recording=false;$('#record-btn').classList.remove('live');$('#rec-status').textContent='Creating demo transcript…';$('#pause-btn').classList.add('hidden');$('#stop-btn').classList.add('hidden');setTimeout(()=>{if(!$('#capture-text'))return;draft=demoTexts[currentKind];$('#capture-text').value=draft;$('#rec-status').textContent='Demo transcript ready · 0:03';$('#record-btn').disabled=false},650)}function playDemo(){toast('Silent demo playback · 0:03','No audio was recorded.');}function reviewCapture(){if(recording){toast('Finish recording first');return}draft=$('#capture-text').value.trim();if(!draft){toast('Add a few words first','Or try the sample text.');return}if(currentKind!=='debrief'){if(currentKind==='prep')state.prep+=(state.prep?'\n\n':'')+draft;else state.thoughts.push({date:new Date().toISOString(),text:draft,kind:currentKind});save();closeModal();render();toast(saved?'Thought saved':'Save unavailable','You can find it in Next session.');return}showModal(`<h2 style="margin-top:20px">What do you want to carry forward?</h2><div class="summary"><span class="badge">Demo AI · Example response</span><p style="margin-top:10px">A useful takeaway might be: choose one manageable thing to explore, and bring your experience back next time.</p></div><label class="field"><span>Session title</span><input type="text" id="session-title" value="Choosing my own next step"></label><label class="field"><span>My takeaway · edit this suggestion</span><textarea id="takeaway" style="min-height:90px">${esc(draft.slice(0,220))}${draft.length>220?'…':''}</textarea></label><label class="field"><span>What would I like to prepare or try?</span><input type="text" id="next-action" placeholder="One small thing I choose for myself"></label><p class="small">Your original words will be kept with this session.</p><div class="actions"><button class="secondary" onclick="captureUI()">Back</button><button class="primary" onclick="saveDebrief()">Save session</button></div>`)}function saveDebrief(){const action=$('#next-action').value.trim();state.notes.unshift({date:new Date().toISOString(),title:$('#session-title').value.trim()||'Session debrief',text:draft,takeaway:$('#takeaway').value,kind:'Session debrief'});if(action)state.tasks.push({title:action,note:'Chosen after a session. Explore it in your own time.',done:false});save();closeModal();go('history');toast(saved?'Session saved':'Save unavailable',action?'Your chosen practice is on My week.':'Come back whenever you are ready.')}function editTask(i){const t=state.tasks[i]||{title:'',note:''};showModal(`<h2 style="margin-top:20px">Something I choose to try</h2><p class="sub">Keep it small enough to fit into an ordinary day.</p><label class="field"><span>What would be useful?</span><input id="task-title" type="text" value="${esc(t.title)}" placeholder="Notice one moment when…"></label><label class="field"><span>A little context</span><input id="task-note" type="text" value="${esc(t.note)}"></label><div class="actions">${i!==undefined?`<button class="secondary" onclick="state.tasks.splice(${i},1);save();closeModal();render()">Remove</button>`:''}<button class="primary" onclick="saveTask(${i===undefined?'null':i})">Save practice</button></div>`)}function saveTask(i){const title=$('#task-title').value.trim();if(!title){toast('Give your practice a name');return}const t={title,note:$('#task-note').value,done:i===null?false:state.tasks[i].done};if(i===null)state.tasks.push(t);else state.tasks[i]=t;save();closeModal();render()}function editAppointment(){showModal(`<h2 style="margin-top:20px">Your next appointment</h2><label class="field"><span>Date and time · your local time</span><input id="appointment-date" type="datetime-local" value="${state.appointment}"></label><label class="field"><span>Duration in minutes</span><input id="duration" type="number" min="10" max="240" value="${state.duration}"></label><label><input id="weekly" type="checkbox" ${state.weekly?'checked':''}> Repeat weekly</label><div class="actions"><button class="primary" onclick="saveAppointment()">Save appointment</button></div>`)}function saveAppointment(){const dt=$('#appointment-date').value,n=Number($('#duration').value);if(!dt||n<10||n>240){toast('Check the date and duration');return}state.appointment=dt;state.duration=n;state.weekly=$('#weekly').checked;save();closeModal();render();toast('Appointment saved','Reminder preferences follow your appointment. This demo does not schedule alerts.')}function addSection(){showModal(`<h2 style="margin-top:20px">Make this space yours.</h2><label class="field"><span>Section name</span><input type="text" id="section-name" placeholder="Questions I want to ask"></label><div class="actions"><button class="primary" onclick="saveSection()">Add section</button></div>`)}function saveSection(){const title=$('#section-name').value.trim();if(!title)return;state.customSections.push({title,text:''});save();closeModal();render()}function previewReminder(){const k=$('#preview-kind').value;const body=state.reminders.private?'You have a moment set aside. Tap to open your notes.':k==='brief'?briefPoints().slice(0,2).join(' • '):k==='debrief'?'What stayed with you? Take a moment to debrief your session.':'Would you like to continue your chosen practice?';showModal(`<div class="eyebrow" style="margin-top:20px">Notification preview · simulated</div><div class="card" style="background:var(--bg);margin:18px 0"><div class="row"><span class="small">❋ Meanwhile</span><span class="small">now</span></div><h3 style="margin-top:12px">${state.reminders.private?'A moment for yourself':k==='brief'?'Your session is coming up':k==='debrief'?'A moment to debrief':'Pick up a thought'}</h3><p style="margin-top:8px">${esc(body)}</p></div><p class="small">${state.reminders.private?'Discreet text is on. Turn it off to preview your talking points.':'Detailed text can appear on your lock screen.'}</p><div class="actions"><button class="secondary" onclick="closeModal();toast('Snoozed in demo','No phone reminder has been scheduled.')">Later</button><button class="primary" onclick="closeModal();${k==='debrief'?"openCapture('debrief')":k==='practice'?"openCapture('practice')":"go('prep')"}">Open ${k==='brief'?'my brief':'my notes'}</button></div>`)}function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meanwhile-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>toast('Offline setup unavailable','You can still use Meanwhile online.'));});}
</script></body></html>
